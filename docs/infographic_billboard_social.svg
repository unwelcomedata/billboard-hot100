<?xml version="1.0" encoding="UTF-8"?>
<!--
  @unwelcomedata — PROJECT INFOGRAPHIC (landscape social render)
  Project: billboard-hot100
  1600x900 feed render. Same brand FRAME formatting (header/footer/dividers),
  re-laid into two columns. Numbers/colors identical to the tall poster.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== CANVAS ===== -->
  <rect width="1600" height="900" fill="#FBF8F0"/>

  <!-- ============================================================= -->
  <!-- HEADER BAND (navy)                                            -->
  <!-- ============================================================= -->
  <rect x="0" y="0" width="1600" height="190" fill="#003049"/>
  <text x="80" y="92" fill="#FFFFFF" font-size="52" font-weight="bold">How Genres Rose and Fell on the Hot 100</text>
  <text x="80" y="140" fill="#94D2BD" font-size="32" font-weight="bold">Seven decades of chart presence &#8212; and what streaming changed</text>
  <text x="80" y="174" fill="#E9D8A6" font-size="21">Rank of each genre by chart slots, and the longest-charting songs before vs during the streaming era.</text>

  <!-- vertical divider between the two columns -->
  <line x1="800" y1="230" x2="800" y2="790" stroke="#E9D8A6" stroke-width="3"/>

  <!-- ============================================================= -->
  <!-- LEFT COLUMN — THE RANK FLIP                                   -->
  <!-- ============================================================= -->
  <text x="80" y="268" fill="#003049" font-size="28" font-weight="bold">Rock ruled, then hip-hop took over</text>
  <text x="80" y="296" fill="#6B7280" font-size="19">Genre rank by Hot 100 chart slots, per decade (#1 = most).</text>

  <!-- rank grid: cols x=190,290,390,490,590,690 (70s..20s); rows y=350..575 step45; dot r=11 -->
  <text x="190" y="330" fill="#6B7280" font-size="17" font-weight="bold" text-anchor="middle">70s</text>
  <text x="290" y="330" fill="#6B7280" font-size="17" font-weight="bold" text-anchor="middle">80s</text>
  <text x="390" y="330" fill="#6B7280" font-size="17" font-weight="bold" text-anchor="middle">90s</text>
  <text x="490" y="330" fill="#6B7280" font-size="17" font-weight="bold" text-anchor="middle">00s</text>
  <text x="590" y="330" fill="#6B7280" font-size="17" font-weight="bold" text-anchor="middle">10s</text>
  <text x="690" y="330" fill="#6B7280" font-size="17" font-weight="bold" text-anchor="middle">20s</text>

  <text x="150" y="356" fill="#6B7280" font-size="15" text-anchor="end">#1</text>
  <text x="150" y="401" fill="#6B7280" font-size="15" text-anchor="end">#2</text>
  <text x="150" y="446" fill="#6B7280" font-size="15" text-anchor="end">#3</text>
  <text x="150" y="491" fill="#6B7280" font-size="15" text-anchor="end">#4</text>
  <text x="150" y="536" fill="#6B7280" font-size="15" text-anchor="end">#5</text>
  <text x="150" y="581" fill="#6B7280" font-size="15" text-anchor="end">#6</text>

  <!-- rows: rank1->y350 rank2->395 rank3->440 rank4->485 rank5->530 rank6->575 -->
  <!-- ROCK 1,1,1,4,6,5 -->
  <polyline points="190,350 290,350 390,350 490,485 590,575 690,530" fill="none" stroke="#003049" stroke-width="3" opacity="0.55"/>
  <circle cx="190" cy="350" r="11" fill="#003049"/><circle cx="290" cy="350" r="11" fill="#003049"/><circle cx="390" cy="350" r="11" fill="#003049"/><circle cx="490" cy="485" r="11" fill="#003049"/><circle cx="590" cy="575" r="11" fill="#003049"/><circle cx="690" cy="530" r="11" fill="#003049"/>
  <!-- HIP-HOP/RAP 6,6,3,2,2,1 -->
  <polyline points="190,575 290,575 390,440 490,395 590,395 690,350" fill="none" stroke="#94D2BD" stroke-width="3" opacity="0.75"/>
  <circle cx="190" cy="575" r="11" fill="#94D2BD"/><circle cx="290" cy="575" r="11" fill="#94D2BD"/><circle cx="390" cy="440" r="11" fill="#94D2BD"/><circle cx="490" cy="395" r="11" fill="#94D2BD"/><circle cx="590" cy="395" r="11" fill="#94D2BD"/><circle cx="690" cy="350" r="11" fill="#94D2BD"/>
  <!-- POP 3,3,4,3,1,3 -->
  <polyline points="190,440 290,440 390,485 490,440 590,350 690,440" fill="none" stroke="#0A9396" stroke-width="3" opacity="0.45"/>
  <circle cx="190" cy="440" r="11" fill="#0A9396"/><circle cx="290" cy="440" r="11" fill="#0A9396"/><circle cx="390" cy="485" r="11" fill="#0A9396"/><circle cx="490" cy="440" r="11" fill="#0A9396"/><circle cx="590" cy="350" r="11" fill="#0A9396"/><circle cx="690" cy="440" r="11" fill="#0A9396"/>
  <!-- COUNTRY 4,5,6,1,3,2 -->
  <polyline points="190,485 290,530 390,575 490,350 590,440 690,395" fill="none" stroke="#EE9B00" stroke-width="3" opacity="0.40"/>
  <circle cx="190" cy="485" r="11" fill="#EE9B00"/><circle cx="290" cy="530" r="11" fill="#EE9B00"/><circle cx="390" cy="575" r="11" fill="#EE9B00"/><circle cx="490" cy="350" r="11" fill="#EE9B00"/><circle cx="590" cy="440" r="11" fill="#EE9B00"/><circle cx="690" cy="395" r="11" fill="#EE9B00"/>
  <!-- R&B/SOUL 2,2,2,5,5,4 -->
  <polyline points="190,395 290,395 390,395 490,530 590,530 690,485" fill="none" stroke="#BB3E03" stroke-width="3" opacity="0.35"/>
  <circle cx="190" cy="395" r="11" fill="#BB3E03"/><circle cx="290" cy="395" r="11" fill="#BB3E03"/><circle cx="390" cy="395" r="11" fill="#BB3E03"/><circle cx="490" cy="530" r="11" fill="#BB3E03"/><circle cx="590" cy="530" r="11" fill="#BB3E03"/><circle cx="690" cy="485" r="11" fill="#BB3E03"/>
  <!-- DANCE/ELECTRONIC 5,4,5,6,4,6 -->
  <polyline points="190,530 290,485 390,530 490,575 590,485 690,575" fill="none" stroke="#CA6702" stroke-width="3" opacity="0.30"/>
  <circle cx="190" cy="530" r="11" fill="#CA6702"/><circle cx="290" cy="485" r="11" fill="#CA6702"/><circle cx="390" cy="530" r="11" fill="#CA6702"/><circle cx="490" cy="575" r="11" fill="#CA6702"/><circle cx="590" cy="485" r="11" fill="#CA6702"/><circle cx="690" cy="575" r="11" fill="#CA6702"/>

  <!-- inline genre key -->
  <circle cx="90" cy="630" r="9" fill="#003049"/><text x="106" y="637" fill="#003049" font-size="18" font-weight="bold">Rock</text>
  <circle cx="200" cy="630" r="9" fill="#94D2BD"/><text x="216" y="637" fill="#2A7D63" font-size="18" font-weight="bold">Hip-Hop/Rap</text>
  <circle cx="400" cy="630" r="9" fill="#0A9396"/><text x="416" y="637" fill="#6B7280" font-size="18">Pop</text>
  <circle cx="486" cy="630" r="9" fill="#EE9B00"/><text x="502" y="637" fill="#6B7280" font-size="18">Country</text>
  <circle cx="610" cy="630" r="9" fill="#BB3E03"/><text x="626" y="637" fill="#6B7280" font-size="18">R&amp;B/Soul</text>

  <text x="80" y="700" fill="#6B7280" font-size="20">Rock sat <tspan fill="#003049" font-weight="bold">#1 from the 70s into the 90s</tspan>, then slid to the bottom.</text>
  <text x="80" y="728" fill="#6B7280" font-size="20">Hip-Hop/Rap climbed from last to <tspan fill="#2A7D63" font-weight="bold">#1 by the 2020s</tspan>.</text>

  <!-- ============================================================= -->
  <!-- RIGHT COLUMN — LONGEVITY + GENRE FLIP                         -->
  <!-- ============================================================= -->
  <text x="860" y="268" fill="#003049" font-size="28" font-weight="bold">Streaming stretched chart life</text>
  <text x="860" y="296" fill="#6B7280" font-size="19">Most weeks one song ever spent on the Hot 100.</text>

  <!-- bars: track x1020 -> x1520 is 500px at max 112 -->
  <!-- Pre 87 -> 388.4 -->
  <text x="1005" y="352" fill="#003049" font-size="19" font-weight="bold" text-anchor="end">Pre-streaming</text>
  <rect x="1020" y="332" width="388.4" height="34" fill="#003049"/>
  <text x="1034" y="356" fill="#FFFFFF" font-size="19" font-weight="bold">87 wks</text>
  <text x="860" y="398" fill="#6B7280" font-size="17">Radioactive &#183; Imagine Dragons (1958&#8211;2012)</text>
  <!-- Stream 112 -> 500.0 -->
  <text x="1005" y="440" fill="#003049" font-size="19" font-weight="bold" text-anchor="end">Streaming era</text>
  <rect x="1020" y="420" width="500.0" height="34" fill="#BB3E03"/>
  <text x="1034" y="444" fill="#FFFFFF" font-size="19" font-weight="bold">112 wks</text>
  <text x="860" y="486" fill="#6B7280" font-size="17">Lose Control &#183; Teddy Swims (2013&#8211;2026)</text>

  <!-- gold divider inside right column -->
  <line x1="860" y1="520" x2="1520" y2="520" stroke="#E9D8A6" stroke-width="3"/>

  <text x="860" y="560" fill="#003049" font-size="28" font-weight="bold">And the mix flipped genre</text>
  <text x="860" y="588" fill="#6B7280" font-size="18">Genre of the 10 longest-charting songs per era (one block = one song).</text>

  <!-- PRE row: Pop4 Rock3 Country2 HipHop1  (blocks w60 gap4 start x860 y604) -->
  <text x="860" y="620" fill="#6B7280" font-size="16">Pre-streaming</text>
  <rect x="860"  y="628" width="60" height="34" fill="#0A9396"/>
  <rect x="924"  y="628" width="60" height="34" fill="#0A9396"/>
  <rect x="988"  y="628" width="60" height="34" fill="#0A9396"/>
  <rect x="1052" y="628" width="60" height="34" fill="#0A9396"/>
  <rect x="1116" y="628" width="60" height="34" fill="#003049"/>
  <rect x="1180" y="628" width="60" height="34" fill="#003049"/>
  <rect x="1244" y="628" width="60" height="34" fill="#003049"/>
  <rect x="1308" y="628" width="60" height="34" fill="#EE9B00"/>
  <rect x="1372" y="628" width="60" height="34" fill="#EE9B00"/>
  <rect x="1436" y="628" width="60" height="34" fill="#94D2BD"/>

  <!-- STREAM row: R&B4 Dance3 Pop2 Country1 -->
  <text x="860" y="692" fill="#6B7280" font-size="16">Streaming era</text>
  <rect x="860"  y="700" width="60" height="34" fill="#BB3E03"/>
  <rect x="924"  y="700" width="60" height="34" fill="#BB3E03"/>
  <rect x="988"  y="700" width="60" height="34" fill="#BB3E03"/>
  <rect x="1052" y="700" width="60" height="34" fill="#BB3E03"/>
  <rect x="1116" y="700" width="60" height="34" fill="#CA6702"/>
  <rect x="1180" y="700" width="60" height="34" fill="#CA6702"/>
  <rect x="1244" y="700" width="60" height="34" fill="#CA6702"/>
  <rect x="1308" y="700" width="60" height="34" fill="#0A9396"/>
  <rect x="1372" y="700" width="60" height="34" fill="#0A9396"/>
  <rect x="1436" y="700" width="60" height="34" fill="#EE9B00"/>

  <text x="860" y="768" fill="#6B7280" font-size="19"><tspan fill="#003049" font-weight="bold">No Rock</tspan> in the streaming top 10 &#8212; R&amp;B/Soul &amp; Dance/Electronic lead.</text>
  <text x="860" y="792" fill="#BB3E03" font-size="19" font-weight="bold">The hinge: 2013 &#8212; streaming entered the Hot 100 formula.</text>

  <!-- ============================================================= -->
  <!-- FOOTER BAND                                                   -->
  <!-- ============================================================= -->
  <rect x="0" y="810" width="1600" height="90" fill="#003049"/>
  <text x="80" y="852" fill="#FFFFFF" font-size="22" font-weight="bold">@unwelcomedata</text>
  <text x="80" y="882" fill="#94D2BD" font-size="18">Billboard Hot 100 chart history &#183; genre via MusicBrainz artist tags &#183; post-2013 reflects the modern streaming-weighted formula.</text>
</svg>

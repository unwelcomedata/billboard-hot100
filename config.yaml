project_name: "billboard-hot100"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # 1. Billboard Hot 100 full chart history — every weekly chart 1958-08-04 → present
  #    (one JSON array of chart objects; keyless raw-GitHub download, updated daily).
  #    Schema: [{date, data:[{song, artist, this_week, last_week, peak_position, weeks_on_chart}]}]
  hot100_all:
    url: https://raw.githubusercontent.com/mhollingshead/billboard-hot-100/main/all.json
    type: json
    publisher: "mhollingshead/billboard-hot-100 (GitHub) — crawl of Billboard.com Hot 100"
    license: "public GitHub data; underlying chart © Billboard — used for non-commercial research"

  # 2. Genre enrichment — MusicBrainz artist tags (keyless; rate-limit >= 1 req/sec).
  #    Billboard carries NO genre, so genre is derived at the ARTIST level from MB tags,
  #    then bucketed to aggregate genres in 02-clean. Queried per unique artist in ingest.
  musicbrainz_artist:
    url: "https://musicbrainz.org/ws/2/artist"
    type: json
    publisher: "MusicBrainz (keyless Web Service v2)"
    license: "MusicBrainz data under CC0 / CC-BY-NC-SA; see musicbrainz.org/doc/About/Data_License"

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
